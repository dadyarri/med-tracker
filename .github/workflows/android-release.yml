name: Android Release Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore release signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          for variable in RELEASE_KEYSTORE_BASE64 RELEASE_KEY_ALIAS RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing release signing secret: $variable. Run scripts/configure-release-signing.sh locally to configure ANDROID_RELEASE_* secrets; see README.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/medtracker-release.keystore"
          keytool -certreq -keystore "$RUNNER_TEMP/medtracker-release.keystore" \
            -storepass:env RELEASE_STORE_PASSWORD -keypass:env RELEASE_KEY_PASSWORD \
            -alias "$RELEASE_KEY_ALIAS" > /dev/null

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          answers="$RUNNER_TEMP/android-sdk-license-answers.txt"
          for i in {1..100}; do echo y; done > "$answers"
          sdkmanager --sdk_root="$ANDROID_HOME" --licenses < "$answers"

      - name: Install Android SDK
        run: sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools' 'ndk;29.0.14206865'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release, test and lint
        run: ./gradlew --no-daemon assembleRelease testDebugUnitTest lintRelease --warning-mode all

      - name: Sign and verify release APK
        working-directory: app/build/outputs/apk/release
        shell: bash
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/medtracker-release.keystore" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out MedTracker-release.apk \
            app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            MedTracker-release.apk | tee signing-certificate.txt
          sha256sum MedTracker-release.apk > SHA256SUMS

      - name: Publish GitHub Release
        working-directory: app/build/outputs/apk/release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          if state=$(gh release view "$tag" --json isDraft,targetCommitish); then
            if [[ $(jq -r '.targetCommitish' <<< "$state") != "$GITHUB_SHA" ]]; then
              echo "::error::Release tag already belongs to a different commit."
              exit 1
            fi
            if [[ $(jq -r '.isDraft' <<< "$state") == false ]]; then
              echo "Release already published; keeping existing assets unchanged."
              exit 0
            fi
            gh release upload "$tag" MedTracker-release.apk signing-certificate.txt SHA256SUMS --clobber
          else
            gh release create "$tag" MedTracker-release.apk signing-certificate.txt SHA256SUMS \
              --target "$GITHUB_SHA" --title "MedTracker · build ${GITHUB_RUN_NUMBER}" \
              --generate-notes --draft
          fi
          gh release edit "$tag" --draft=false --latest

      - name: Remove release signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/medtracker-release.keystore"
