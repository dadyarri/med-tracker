name: Android APK
on:
  push:
    branches: ['feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore persistent test signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::error::Set repository secret ANDROID_DEBUG_KEYSTORE_BASE64 using scripts/configure-ci-signing.sh. Refusing to generate a different APK signing key."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey > /dev/null
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          # Accept explicitly below, after the action exports ANDROID_HOME.
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          # A finite input file preserves sdkmanager's exit status under pipefail.
          # `yes | sdkmanager` can otherwise fail with SIGPIPE after success.
          answers="${RUNNER_TEMP}/android-sdk-license-answers.txt"
          for i in {1..100}; do echo y; done > "$answers"
          sdkmanager --sdk_root="$ANDROID_HOME" --licenses < "$answers"
      - name: Install Android SDK
        run: sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools' 'ndk;29.0.14206865'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Verify APK and record public signing certificate
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk \
            | tee app/build/outputs/apk/debug/signing-certificate.txt
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MedTracker-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/signing-certificate.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
