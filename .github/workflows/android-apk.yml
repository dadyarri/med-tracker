name: Android APK
on:
  push:
    branches: [master, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          # Accept explicitly below, after the action exports ANDROID_HOME.
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          # A finite input file preserves sdkmanager's exit status under pipefail.
          # `yes | sdkmanager` can otherwise fail with SIGPIPE after success.
          answers="${RUNNER_TEMP}/android-sdk-license-answers.txt"
          for i in {1..100}; do echo y; done > "$answers"
          sdkmanager --sdk_root="$ANDROID_HOME" --licenses < "$answers"
      - name: Install Android SDK
        run: sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MedTracker-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
